[DockDistributionOffice]
# Dock Distribution Office v1.0.0 - public release.
# Ordinary ship depots and the native "move to depot" selector are supported.
enabled = 1

# Workshop object detection. This must match the final asset folder prefix.
descriptor_marker = DockDistributionOffice
descriptor_scan_bytes = 8192

# distribution = show Distribution Office panel first
# fleet        = show normal Ship Dock panel first
default_panel = distribution

# F8 switches between Fleet and Distribution panels.
enable_panel_hotkey = 1
panel_toggle_vk = 119

# Accept native ship cargo harbours without road/garage validation.
enable_ship_harbour_selector = 1
selector_diagnostics = 1

# Overseas endpoints are explicit button actions only.
enable_overseas_targets = 1
show_overseas_buttons = 1
auto_seed_overseas_targets = 0
enable_overseas_hotkeys = 0

# The two border buttons are now arranged horizontally:
# [Soviet] [Western/NATO]
overseas_button_x = 394
overseas_button_source_y = 290
overseas_button_size = 42
overseas_button_gap = 4

# MANAGER-OWNED CONTROLLER
# The road Distribution Office planner is not used for marked Distribution Docks.
enable_manager_controller = 1

# Destination percentages are dispatch TRIGGERS, not refill targets.
# A ship aims to load to this many thousandths of compatible cargo capacity.
# 999 = 99.9%. This normally displays as a full load while avoiding the exact
# 100% edge case that can leave a vehicle waiting on floating-point rounding.
minimum_departure_load_permille = 999

# Legacy compatibility only. Used when minimum_departure_load_permille is absent.
minimum_departure_load_percent = 90
wait_until_fully_unloaded = 1

# The source-row percentage is a domestic source reserve, NOT a smaller trip
# size. Recommended default: 0%. When a non-zero reserve is used, the ship keeps
# its 99.9% departure target but loading pauses when the source reaches the
# protected percentage. The ship stays at the source and resumes loading only
# when production/deliveries create new cargo above the reserve. Overseas
# sources ignore this reserve because they represent purchased cargo.

# Runtime reservations and save/load reconstruction.
enable_task_reservations = 1
reconstruct_world_vehicle_routes = 1
ownership_grace_ticks = 1800

# After a ship unloads completely, check the same destination again. If it is
# still below its dispatch trigger, keep the reservation and send that ship
# directly back to the source instead of forcing an empty office round-trip.
direct_repeat_if_below_trigger = 1

# Non-zero domestic source reserves need tight route-index control while a ship
# waits for replenishment. 1 tick is recommended. This fast cadence is used only
# for the affected active ship, not for every idle office.
source_reserve_control_ticks = 1

# Active voyages cache the task that created them, but the player may edit its
# source reserve or destination trigger while the ship is away or held at a
# source. After the panel closes, the cache is refreshed once the native UI quiet
# period expires. This low-frequency fallback also refreshes active jobs if that
# close event was missed. 300 ticks is recommended.
active_task_policy_refresh_ticks = 300

# Controller cadence. Idle offices do one cheap task/storage pass every 300
# dispatcher ticks. Active voyages update more often; reserve-held and direct-
# repeat departure transitions temporarily use source_reserve_control_ticks.
idle_controller_ticks = 300
active_controller_ticks = 15
world_scan_ticks = 600

# Existing-save safety: wait for buildings, resources, and factory links to finish
# restoring before reading connected harbour storage through the verified native building-statistics path.
manager_load_grace_ticks = 600
manager_assignment_stable_ticks = 300

# While the Distribution Dock panel is open, assignment vectors and connected
# storage links can be in transient native UI states. Active voyages continue,
# but new demand probes wait this many dispatcher ticks after the panel closes.
ui_edit_quiet_ticks = 300

# Maximum new voyages created by one office in one controller pass.
max_dispatch_per_pass = 3

# Saved-task compatibility. The native assignment config has two verified
# 0xC8-byte halves. If an old experimental save retains a selected resource
# vector but loses the one-byte half enable flag, recover the unambiguous half.
recover_saved_task_halves = 1
task_parse_diagnostics = 1


# Small hysteresis around destination/source percentages (2 = 0.2%).
trigger_epsilon_permille = 2

# Diagnostics.
dispatch_diagnostics = 1
custom_policy_diagnostics = 1
probe = 1
log_assignment_changes = 1

# Removed crash-prone paths. Keep disabled.
enable_vehicle_lifecycle_adapter = 0
enable_native_dispatch = 0
