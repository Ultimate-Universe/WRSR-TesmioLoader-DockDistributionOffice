$ITEM_DESC "[h1]COMRADE, THE ROADS ARE FULL AND THE RIVER IS RIGHT THERE![/h1]
Your glorious republic produces thousands of tonnes of cargo every year.
Unfortunately, your trucks are trapped in traffic, your trains are waiting at signals, and your ship captains are sitting around the harbour discussing whether anything interesting will ever happen to them.

[b]DO NOT PANIC, COMRADE![/b]

The Central Planning Bureau has approved a new instrument of socialist logistics:

[h1]DOCK DISTRIBUTION OFFICE[/h1]

The Dock Distribution Office turns a ship dock into a waterborne distribution office. It allows compatible cargo ships to collect and distribute goods between cargo harbours and overseas customs connections.

The Workshop item includes two variants:
[list]
[*][b]Dock Distribution Office (Small)[/b]
[*][b]Dock Distribution Office (Medium)[/b]
[/list]

It is intended for specialised, high-volume routes where water offers a useful alternative to sending another sixteen thousand trucks through the centre of your capital.

[h1]IMPORTANT — READ BEFORE USING[/h1]
[b]THE DOCK DISTRIBUTION OFFICE USES UNIQUE DISTRIBUTION LOGIC.[/b]
It does not behave exactly like a normal road Distribution Office.

[list]
[*][b]Close the Dock Distribution Office panel after editing its tasks.[/b]
While the panel is open, new dispatches are temporarily paused so the plugin does not inspect assignment records while the native interface is rebuilding them. Closing the panel applies the finished setup and allows the office to evaluate its jobs. It also refreshes the source-reserve and destination-trigger settings used by ships already on active voyages. You do not need to repeatedly open and close the panel during normal operation.

[*][b]The destination percentage is the dispatch trigger.[/b]
When a destination falls below its configured threshold, the office may dispatch an available ship. The percentage controls [b]when the journey begins[/b]; it is not a target amount for a partial refill.

[*][b]Ships attempt to load to 99.9 percent of compatible capacity.[/b]
The tiny margin avoids exact-full floating-point edge cases. In normal gameplay this behaves as a full shipload. Choose ships based on the actual size and speed of the assigned cargo flow.

[*][b]The source percentage is a protected domestic reserve.[/b]
The recommended default is [b]0 percent[/b]. With a non-zero reserve, the ship loads only cargo available above that percentage. If the source reaches its protected reserve before the ship is full, loading pauses and the ship [b]remains berthed at the source[/b]. It resumes loading whenever production or deliveries create more cargo above the reserve, and it departs only after reaching its 99.9 percent ship-load target. If you lower the reserve while a ship is waiting, close the Dock Distribution Office panel; the active ship will refresh the new threshold and resume loading when cargo is available above it. Overseas sources ignore this reserve because their cargo is purchased.

[*][b]Ships remain at the destination until their assigned cargo is completely unloaded.[/b]
Do not use enormous ships for tiny delivery tasks unless you are happy for them to occupy the destination berth for a long time.

[*][b]An empty ship may repeat the same delivery without returning to the office first.[/b]
After unloading, the office checks that destination again. If it is still below its configured trigger, the same ship keeps the reservation and travels directly back to the source for another full load. If the destination has reached or exceeded the trigger, the ship returns to its Dock Distribution Office and becomes available for another job.

[*][b]Only one ship is assigned to a destination at a time.[/b]
Different destinations may use different ships simultaneously, subject to the available fleet.

[*][b]Ships are slow. Loading is slow. Unloading is slow.[/b]
Do not assign forty unrelated jobs to one Dock Distribution Office and then express surprise when factories begin running dry. The Ministry of Maritime Logistics cannot repeal distance, water or the concept of time.
[/list]

[h1]BASIC OPERATION[/h1]
[list=1]
[*]Build either Dock Distribution Office variant and purchase or transfer compatible cargo ships into it.
[*]Open the building. Press [b]F8[/b] to switch between the ordinary Fleet panel and the Distribution Office task panel when required.
[*]Add a source and enable the required cargo in the source row. For overseas purchases, use the Soviet or Western button supplied by the mod.
[*]Add a compatible cargo harbour as a destination, enable unloading, and set the desired dispatch threshold.
[*]Set domestic source reserves to 0 percent unless you deliberately want to protect stock at the source.
[*]Close the building panel. Eligible ships will be dispatched after the safety check.
[/list]

[h1]INTENDED GAMEPLAY[/h1]
The Dock Distribution Office is a niche logistics building for a small number of predictable, high-volume jobs.

[b]Choose ships based on the actual size and speed of the assigned cargo flow.[/b]
A larger ship is not automatically a better ship. Use smaller ships for low-volume or frequently repeated deliveries. Use larger ships only where the source, destination and consumption rate can support a large floating stockpile.

The office should supplement road, rail and ordinary harbour infrastructure—not become the single point of failure for your entire republic.

[h1]INSTALLATION — TESMIOLOADER REQUIRED[/h1]
The Dock Distribution Office contains both building assets and a TesmioLoader plugin. The buildings are installed by Steam, but the scripted Distribution Office functionality requires a manual plugin copy.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3773169177]Download TesmioLoader from the Steam Workshop[/url]

After subscribing:
[list=1]
[*]Open:
[code]Steam\steamapps\workshop\content\784150\3776862813\plugins[/code]
[*]Copy:
[code]DockDistributionOffice.dll
DockDistributionOffice.ini[/code]
[*]Paste both files into:
[code]Steam\steamapps\common\SovietRepublic\tesmioloader\build\plugins[/code]
[*][b]Delete any older ship_distribution.dll and ship_distribution.ini files.[/b] Leaving the old and renamed plugins together may cause duplicate hooks and crashes.
[*]Run:
[code]Steam\steamapps\common\SovietRepublic\tesmioloader\build\tesmiolauncher.exe[/code]
[*]Make sure [b]DockDistributionOffice.dll[/b] is enabled, then launch the game through TesmioLoader.
[/list]

The mod will not provide its scripted functionality when the game is launched normally through Steam.

[h1]COMPATIBILITY AND SAFETY[/h1]
The Dock Distribution Office modifies live game behaviour through TesmioLoader hooks. Hook locations are checked against known native signatures at runtime, with relocation scanning and chain-safe handling when another Tesmio plugin has already detoured the same entry point.

Back up important saves before installing new versions of this or any other script-based mod. A game or TesmioLoader update may require the plugin to be updated before its scripted functionality works correctly again.

Do not make one scripted building the sole supply route for essential services or critical industries.

[h1]SOURCE CODE AND BUG REPORTS[/h1]
Source code, technical notes, build files and the issue tracker are available on GitHub:

[url=https://github.com/Ultimate-Universe/WRSR-TesmioLoader-DockDistributionOffice]Dock Distribution Office on GitHub[/url]

When reporting a problem, please include:
[list]
[*]What happened
[*]The steps required to reproduce it
[*]Your Dock Distribution Office version
[*]Your TesmioLoader version
[*]Your full tesmioloader.log file
[/list]

