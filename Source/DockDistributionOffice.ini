[DockDistributionOffice]
# Dock Distribution Office v1.1.0
# Supported game build: WRSR v1.1.1.9
# TesmioLoader plugin API: 4
enabled = 1

# Workshop object detection. This must match the asset folder prefix.
descriptor_marker = DockDistributionOffice
descriptor_scan_bytes = 8192

# distribution = show the Distribution Office panel first
# fleet        = show the ordinary Ship Dock panel first
default_panel = distribution

# F8 switches between Fleet and Distribution panels.
enable_panel_hotkey = 1
panel_toggle_vk = 119

# Accept native ship cargo harbours in the task selector.
enable_ship_harbour_selector = 1
selector_diagnostics = 1

# Overseas endpoints are added only through the on-panel buttons.
enable_overseas_targets = 1
show_overseas_buttons = 1

# Horizontal button layout: [Soviet] [Western/NATO]
overseas_button_x = 394
overseas_button_source_y = 290
overseas_button_size = 42
overseas_button_gap = 4

# Use the mod-owned ship dispatch controller.
enable_manager_controller = 1

# 999 = 99.9% of compatible ship capacity.
minimum_departure_load_permille = 999
wait_until_fully_unloaded = 1

# Rebuild active voyage state from native routes after loading a save.
reconstruct_world_vehicle_routes = 1
ownership_grace_ticks = 1800

# After unloading, select any valid waiting task before returning home. The
# current task is reused directly when it remains the best eligible task.
direct_repeat_if_below_trigger = 1

# Tight control is used only while an active ship is held at a domestic source.
source_reserve_control_ticks = 1

# Refresh active source-reserve and destination-trigger policy after UI edits.
active_task_policy_refresh_ticks = 300

# Controller cadence.
idle_controller_ticks = 300
active_controller_ticks = 15
world_scan_ticks = 600

# Save-load and native-UI settling periods.
manager_load_grace_ticks = 600
manager_assignment_stable_ticks = 300
ui_edit_quiet_ticks = 300

# Maximum new voyages created by one office in one controller pass.
max_dispatch_per_pass = 3

# Recover an unambiguous task half when its native enable byte is missing.
recover_saved_task_halves = 1
task_parse_diagnostics = 1

# Small hysteresis around source/destination percentages (2 = 0.2%).
trigger_epsilon_permille = 2

# Diagnostics.
dispatch_diagnostics = 1
custom_policy_diagnostics = 1
probe = 1
log_assignment_changes = 1
